services:
  api:
    build:
      context: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: restwell
      POSTGRES_USER: restwell
      POSTGRES_PASSWORD: restwell
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  admin_frontend:
    image: ghcr.io/cirruslabs/flutter:3.22.3
    working_dir: /app
    command: >
      sh -lc "flutter pub get &&
      flutter run -d web-server
      --web-hostname 0.0.0.0
      --web-port 8080
      --dart-define=RESTWELL_API_BASE_URL=http://localhost:8001"
    volumes:
      - ./frontend/admin_app:/app
      - flutter_pub_cache:/root/.pub-cache
    ports:
      - "4201:8080"
    depends_on:
      - api

volumes:
  postgres_data:
  flutter_pub_cache:
